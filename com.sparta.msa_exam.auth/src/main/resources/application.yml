spring:
  application:
    name: auth-service

  profiles:
    active: dev
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

  tracing:
    sampling:
      probability: 1.0

